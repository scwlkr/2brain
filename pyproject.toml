[project]
name = "twobrain-cli"
version = "0.1.2"
description = "Portable, local-first personalization for terminal agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
2brain = "twobrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
