name: npm dist-tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to tag (e.g. 0.1.3)"
        required: true
        type: string
      tag:
        description: "dist-tag name (e.g. latest)"
        required: true
        type: string
        default: latest

permissions:
  contents: read

jobs:
  dist-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is not configured."
            exit 1
          fi

      - name: Set dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"
          echo "Setting dist-tag ${TAG} -> @scwlkr/2brain@${VER}"
          npm dist-tag add "@scwlkr/2brain@${VER}" "${TAG}"
          npm dist-tag ls @scwlkr/2brain
